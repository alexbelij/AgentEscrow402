[package]
name = "tests"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.11"
blake2 = "0.11"

[dev-dependencies]
proptest = "1"
ae402-governance-dao = { path = "../ae402-governance-dao" }
# Real Casper VM regression harness for the insurance-pool tombstone/replay
# invariant (pre-mainnet gate — see docs/INSURANCE_REPLAY_TESTS.md § AE-2
# closure decision). Versions pinned to match the workspace's casper-types
# 6.x lock (Cargo.lock resolves casper-types 6.1.0); casper-engine-test-support
# 8.1.1 requires casper-types ^6.0.1 and casper-execution-engine ^8.1.1, so
# this triple is compatible. Built with the pinned nightly-2025-01-01 toolchain
# (see ../rust-toolchain.toml — newer nightlies emit bulk-memory wasm ops
# Casper testnet preprocessing rejects).
casper-engine-test-support = "8.1.1"
casper-execution-engine = "8.1.1"
# Match casper-engine-test-support 8.1.1's requirement (casper-types ^6.0.1)
# so we don’t pull in two versions of casper-types and produce E0308 across
# AccountHash / URef / SecretKey.
casper-types = "6.1"
hex = "0.4"
# Seed ed25519 keys deterministically for the on-chain VM replay tests
# (casper-types v6's SecretKey doesn't expose a crate-local RNG helper).
getrandom = "0.2"

[[test]]
name = "integration_tests"
path = "src/integration_tests.rs"

[[test]]
name = "property_tests"
path = "src/property_tests.rs"

[[test]]
name = "agent_identity_registry_property_tests"
path = "src/agent_identity_registry_property_tests.rs"

[[test]]
name = "insurance_replay_tests"
path = "src/insurance_replay_tests.rs"

