[workspace]
members = ["escrow", "escrow-manager", "insurance-pool", "vrf-arbiter", "tests", "pool-funder", "arbiter-registrar", "batch-funder", "agent-identity-registry", "id-registry-funder", "test-token", "multi-asset-escrow", "two-key-account", "challenge-arbiter", "range-proof-registry", "ae402-governance-dao", "stubs", "casper-htlc"]
