components:
  schemas:
    AddCapabilityRequest:
      properties:
        capability:
          $ref: '#/components/schemas/AgentCapability'
      type: object
      required:
      - capability
      title: AddCapabilityRequest
    AgentCapability:
      properties:
        name:
          type: string
          title: Name
        version:
          type: string
          title: Version
        description:
          type: string
          title: Description
        verified:
          type: boolean
          title: Verified
          default: false
      type: object
      required:
      - name
      - version
      - description
      title: AgentCapability
    AgentRiskResponse:
      properties:
        agent:
          type: string
          title: Agent
        risk_score:
          type: integer
          title: Risk Score
        anomaly_flag:
          type: boolean
          title: Anomaly Flag
        explanation:
          type: string
          title: Explanation
        model_version:
          type: string
          title: Model Version
        scored_at:
          type: integer
          title: Scored At
        escrow_count:
          type: integer
          title: Escrow Count
        total_volume_motes:
          type: integer
          title: Total Volume Motes
        dispute_rate:
          type: number
          title: Dispute Rate
      type: object
      required:
      - agent
      - risk_score
      - anomaly_flag
      - explanation
      - model_version
      - scored_at
      - escrow_count
      - total_volume_motes
      - dispute_rate
      title: AgentRiskResponse
    ArbiterListResponse:
      properties:
        arbiters:
          items:
            $ref: '#/components/schemas/ReputationScore'
          type: array
          title: Arbiters
        count:
          type: integer
          title: Count
      type: object
      required:
      - arbiters
      - count
      title: ArbiterListResponse
    ArbiterRecord:
      properties:
        arbiter_id:
          type: string
          title: Arbiter Id
        reputation_score:
          type: number
          title: Reputation Score
        completed_arbitrations:
          type: integer
          title: Completed Arbitrations
        availability:
          type: boolean
          title: Availability
          default: true
      type: object
      required:
      - arbiter_id
      - reputation_score
      - completed_arbitrations
      title: ArbiterRecord
    ArbitrateRequest:
      properties:
        dispute_id:
          type: string
          title: Dispute Id
        sender_evidence:
          items:
            $ref: '#/components/schemas/DisputeEvidence'
          type: array
          title: Sender Evidence
        receiver_evidence:
          items:
            $ref: '#/components/schemas/DisputeEvidence'
          type: array
          title: Receiver Evidence
        escrow_amount:
          type: integer
          title: Escrow Amount
      type: object
      required:
      - dispute_id
      - sender_evidence
      - receiver_evidence
      - escrow_amount
      title: ArbitrateRequest
    ArbitrationRecommendation:
      properties:
        dispute_id:
          type: string
          title: Dispute Id
        recommendation:
          type: string
          pattern: ^(favor_sender|favor_receiver|split|escalate)$
          title: Recommendation
        confidence:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Confidence
        reasoning:
          type: string
          title: Reasoning
        risk_factors:
          items:
            type: string
          type: array
          title: Risk Factors
        suggested_split_pct:
          type: number
          maximum: 100.0
          minimum: 0.0
          title: Suggested Split Pct
        analysis_hash:
