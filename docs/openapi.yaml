        service_hash:
          maxLength: 64
          minLength: 64
          title: Service Hash
          type: string
        threshold:
          description: Shares needed to release (n)
          maximum: 255.0
          minimum: 2.0
          title: Threshold
          type: integer
        total:
          description: Total shares generated (m)
          maximum: 255.0
          minimum: 2.0
          title: Total
          type: integer
      required:
      - service_hash
      - threshold
      - total
      title: ThresholdArmRequest
      type: object
    ThresholdArmResponse:
      properties:
        service_hash:
          title: Service Hash
          type: string
        shares_hex:
          items:
            type: string
          title: Shares Hex
          type: array
        threshold_commitment_hex:
          title: Threshold Commitment Hex
          type: string
        threshold_m:
          title: Threshold M
          type: integer
        threshold_n:
          title: Threshold N
          type: integer
        warning:
          default: These shares are shown ONCE and never stored server-side. Distribute them over independent channels to independent holders immediately; losing more than (m - n) of them makes the escrow un-releasable.
          title: Warning
          type: string
      required:
      - service_hash
      - threshold_commitment_hex
      - threshold_n
      - threshold_m
      - shares_hex
      title: ThresholdArmResponse
      type: object
    ThresholdConfig:
      properties:
        aead:
          default: HKDF-SHA256 + HMAC-SHA256-CTR + HMAC-SHA256 authentication
          title: Aead
          type: string
        algorithm:
          default: Shamir Secret Sharing over secp256k1 group order
          title: Algorithm
          type: string
        max_total_shares:
          title: Max Total Shares
          type: integer
        min_threshold:
          title: Min Threshold
          type: integer
        note:
          default: Threshold gate for escrow release-secret. See docs/wow/T3.1-threshold-mpc.md
          title: Note
          type: string
      required:
      - min_threshold
      - max_total_shares
      title: ThresholdConfig
      type: object
    TimeOnlyRequest:
      properties:
        now_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Now Ms
      title: TimeOnlyRequest
      type: object
    TokenIdentifier:
      description: Identifies a token type (CSPR, CEP-18, CEP-78).
      properties:
        contract_hash:
          anyOf:
          - maxLength: 64
            minLength: 64
            type: string
          - type: 'null'
          description: Contract hash for CEP-18/CEP-78 tokens
          title: Contract Hash
        token_type:
          description: 'Type of token: ''cspr'', ''cep18'', or ''cep78'''
          pattern: ^(cspr|cep18|cep78)$
          title: Token Type
          type: string
      required:
      - token_type
      title: TokenIdentifier
      type: object
    ToolCallRequest:
      properties:
        arguments:
          additionalProperties: true
          title: Arguments
          type: object
      title: ToolCallRequest
      type: object
    UpdateReputationRequest:
      properties:
        completed:
          default: 0
          minimum: 0.0
          title: Completed
          type: integer
        disputed:
          default: 0
          minimum: 0.0
          title: Disputed
          type: integer
      title: UpdateReputationRequest
      type: object
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VerificationLevel:
      enum:
      - UNVERIFIED
      - BASIC
      - ENHANCED
      - FULL
      title: VerificationLevel
      type: string
    VerifyEvidenceRequest:
      properties:
        expected_root:
          title: Expected Root
          type: string
        leaf:
          title: Leaf
          type: string
        siblings:
          items:
            $ref: '#/components/schemas/VerifyEvidenceStep'
          title: Siblings
          type: array
      required:
      - leaf
      - siblings
      - expected_root
      title: VerifyEvidenceRequest
      type: object
    VerifyEvidenceResponse:
      properties:
        computed_root:
          title: Computed Root
          type: string
        expected_root:
          title: Expected Root
          type: string
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
        steps:
          title: Steps
          type: integer
        valid:
          title: Valid
          type: boolean
      required:
      - valid
      - computed_root
      - expected_root
      - steps
      title: VerifyEvidenceResponse
      type: object
    VerifyEvidenceStep:
      properties:
        hash:
          title: Hash
          type: string
        position:
          title: Position
          type: string
      required:
      - hash
      - position
      title: VerifyEvidenceStep
      type: object
    _DisputeRubricRequest:
      properties:
        claimant_evidence_count:
          default: 0
          minimum: 0.0
          title: Claimant Evidence Count
          type: integer
        claimant_prior_disputes:
          default: 0
          minimum: 0.0
          title: Claimant Prior Disputes
          type: integer
        claimant_reputation:
          maximum: 100.0
          minimum: 0.0
          title: Claimant Reputation
          type: integer
        escrow_amount_motes:
          exclusiveMinimum: 0.0
          title: Escrow Amount Motes
          type: integer
        evidence_provenance_verified:
          default: false
          title: Evidence Provenance Verified
          type: boolean
        respondent_evidence_count:
          default: 0
          minimum: 0.0
          title: Respondent Evidence Count
          type: integer
        respondent_prior_disputes:
          default: 0
          minimum: 0.0
          title: Respondent Prior Disputes
          type: integer
        respondent_reputation:
          maximum: 100.0
          minimum: 0.0
          title: Respondent Reputation
          type: integer
        time_to_dispute_seconds:
          minimum: 0.0
          title: Time To Dispute Seconds
          type: integer
        x402_replay_flagged:
          default: false
          title: X402 Replay Flagged
          type: boolean
      required:
      - escrow_amount_motes
      - time_to_dispute_seconds
      - claimant_reputation
      - respondent_reputation
      title: _DisputeRubricRequest
      type: object
    _PricingRequest:
      properties:
        escrow_amount_motes:
          exclusiveMinimum: 0.0
          title: Escrow Amount Motes
          type: integer
        reputation:
          maximum: 100.0
          minimum: 0.0
          title: Reputation
          type: integer
      required:
      - escrow_amount_motes
      - reputation
      title: _PricingRequest
      type: object
    server__agent_identity__AgentIdentity:
      description: Details of an agent's registered identity.
      properties:
        agent_id:
          title: Agent Id
          type: string
        capabilities:
          description: List of capabilities delegated to this agent
          items:
            type: string
          title: Capabilities
          type: array
        deploy_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Deploy Hash
        did_document_hash:
          title: Did Document Hash
          type: string
        mode:
          default: local_registry
          title: Mode
          type: string
        public_key:
          title: Public Key
          type: string
        registered_at:
          title: Registered At
          type: integer
        updated_at:
          anyOf:
          - type: integer
          - type: 'null'
          title: Updated At
      required:
      - agent_id
      - public_key
      - did_document_hash
      - registered_at
      title: AgentIdentity
      type: object
    server__bridge_htlc_api__ClaimRequest:
      properties:
        now_ms:
          anyOf:
          - type: integer
          - type: 'null'
          title: Now Ms
        preimage_hex:
          description: the 32-byte secret in hex
          title: Preimage Hex
          type: string
      required:
      - preimage_hex
      title: ClaimRequest
      type: object
    server__cross_chain_api__CancelRequest:
      properties:
        caller:
          maxLength: 140
          minLength: 1
          title: Caller
          type: string
        escrow_id:
          maxLength: 64
          minLength: 1
          title: Escrow Id
          type: string
      required:
      - escrow_id
      - caller
      title: CancelRequest
      type: object
    server__gaming_reward_api__ClaimRequest:
      properties:
        escrow_id:
          title: Escrow Id
          type: string
        proof:
          $ref: '#/components/schemas/RewardInclusionProofDTO'
      required:
      - escrow_id
      - proof
      title: ClaimRequest
      type: object
    server__gaming_reward_api__CommitRequest:
      properties:
        leaves:
          description: Full reward sheet (kept private on the operator side)
          items:
            $ref: '#/components/schemas/RewardLeafDTO'
          title: Leaves
          type: array
        round_id:
          description: Operator-chosen round identifier
          maxLength: 64
          minLength: 1
          title: Round Id
          type: string
      required:
      - round_id
      - leaves
      title: CommitRequest
      type: object
    server__identity_registry__AgentIdentity:
      properties:
        account_hash:
          title: Account Hash
          type: string
        capabilities:
          items:
            $ref: '#/components/schemas/AgentCapability'
          title: Capabilities
          type: array
        did:
          title: Did
          type: string
        display_name:
          title: Display Name
          type: string
        dispute_rate:
          title: Dispute Rate
          type: number
        last_active:
          title: Last Active
          type: integer
        metadata_hash:
          title: Metadata Hash
          type: string
        registered_at:
          title: Registered At
          type: integer
        reputation_score:
          maximum: 100.0
          minimum: 0.0
          title: Reputation Score
          type: integer
        risk_score:
          maximum: 100.0
          minimum: 0.0
          title: Risk Score
          type: integer
        slashed_count:
          title: Slashed Count
          type: integer
        stake:
          default: 0
          minimum: 0.0
          title: Stake
          type: integer
        total_deals:
          title: Total Deals
          type: integer
        verification_level:
          $ref: '#/components/schemas/VerificationLevel'
      required:
      - did
      - account_hash
      - display_name
      - capabilities
      - verification_level
      - reputation_score
      - total_deals
      - dispute_rate
      - registered_at
      - last_active
      - metadata_hash
      - risk_score
      - slashed_count
      title: AgentIdentity
      type: object
    server__identity_registry_api__VerifyRequest:
      properties:
        level:
          $ref: '#/components/schemas/VerificationLevel'
      required:
      - level
      title: VerifyRequest
      type: object
    server__macaroon_api__VerifyRequest:
      properties:
        discharges:
          items:
            type: string
          maxItems: 8
          title: Discharges
          type: array
        facts:
          additionalProperties: true
          title: Facts
          type: object
        now:
          anyOf:
          - type: integer
          - type: 'null'
          title: Now
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      title: VerifyRequest
      type: object
    server__macaroon_api__VerifyResponse:
      properties:
        caveats:
          items:
            type: string
          title: Caveats
          type: array
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
        identifier:
          title: Identifier
          type: string
        ok:
          title: Ok
          type: boolean
      required:
      - ok
      - identifier
      - caveats
      title: VerifyResponse
      type: object
    server__multi_asset__CommitRequest:
      description: Request to commit a hash for an atomic swap.
      properties:
        commit_hash:
          description: SHA256 hash of the secret preimage
          maxLength: 64
          minLength: 64
          title: Commit Hash
          type: string
        service_hash:
          maxLength: 64
          minLength: 64
          title: Service Hash
          type: string
      required:
      - service_hash
      - commit_hash
      title: CommitRequest
      type: object
    server__timelock_api__CancelRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      title: CancelRequest
      type: object
    server__vc_api__VerifyRequest:
      properties:
        credential:
          additionalProperties: true
          title: Credential
          type: object
        expected_issuer:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional did:key to enforce
          title: Expected Issuer
      required:
      - credential
      title: VerifyRequest
      type: object
    server__vc_api__VerifyResponse:
      properties:
        error_detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Detail
        error_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Type
        summary:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Summary
        valid:
