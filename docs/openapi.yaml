        Security: the URL contains a shared secret that Telegram appends to every

        call. Without an exact match on ``TELEGRAM_WEBHOOK_SECRET`` we return

        ``403``. Additionally Telegram forwards the ``X-Telegram-Bot-Api-Secret-Token``

        header when it is set in ``setWebhook``; we accept either match so that

        operators can pick their transport.'
      operationId: webhook_telegram_webhook__secret__post
      parameters:
      - in: path
        name: secret
        required: true
        schema:
          minLength: 1
          title: Secret
          type: string
      requestBody:
        content:
          application/json:
            schema:
              additionalProperties: true
              title: Update
              type: object
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Webhook Telegram Webhook  Secret  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Webhook
      tags:
      - telegram
