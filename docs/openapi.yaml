components:
  schemas:
    AddCapabilityRequest:
      properties:
        capability:
          $ref: '#/components/schemas/AgentCapability'
      required:
      - capability
      title: AddCapabilityRequest
      type: object
    AddThirdPartyRequest:
      properties:
        discharge_identifier:
          maxLength: 128
          minLength: 1
          title: Discharge Identifier
          type: string
        location:
          default: ae402
          maxLength: 64
          minLength: 1
          title: Location
          type: string
        predicate_hint:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          title: Predicate Hint
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      - discharge_identifier
      title: AddThirdPartyRequest
      type: object
    AddThirdPartyResponse:
      properties:
        caveats:
          items:
            type: string
          title: Caveats
          type: array
        token:
          title: Token
          type: string
      required:
      - token
      - caveats
      title: AddThirdPartyResponse
      type: object
    AdvanceBlocksRequest:
      properties:
        blocks:
          maximum: 100000.0
          minimum: 1.0
          title: Blocks
          type: integer
        chain:
          $ref: '#/components/schemas/ChainId'
      required:
      - chain
      - blocks
      title: AdvanceBlocksRequest
      type: object
    AgentCapability:
      properties:
        description:
          title: Description
          type: string
        name:
          title: Name
          type: string
        verified:
          default: false
          title: Verified
          type: boolean
        version:
          title: Version
          type: string
      required:
      - name
      - version
      - description
      title: AgentCapability
      type: object
    AgentRiskResponse:
      properties:
        agent:
          title: Agent
          type: string
        anomaly_flag:
          title: Anomaly Flag
          type: boolean
        dispute_rate:
          title: Dispute Rate
          type: number
        escrow_count:
          title: Escrow Count
          type: integer
        explanation:
          title: Explanation
          type: string
        model_version:
          title: Model Version
          type: string
        risk_score:
          title: Risk Score
          type: integer
        scored_at:
          title: Scored At
          type: integer
        total_volume_motes:
          title: Total Volume Motes
          type: integer
      required:
      - agent
      - risk_score
      - anomaly_flag
      - explanation
      - model_version
      - scored_at
      - escrow_count
      - total_volume_motes
      - dispute_rate
      title: AgentRiskResponse
      type: object
    AgentSimRequest:
      properties:
        base_amount:
          default: 1000000000
          exclusiveMinimum: 0.0
          title: Base Amount
          type: integer
        max_rounds:
          default: 10
          maximum: 100.0
          minimum: 1.0
          title: Max Rounds
          type: integer
        num_escrows:
          default: 100
          maximum: 5000.0
          minimum: 1.0
          title: Num Escrows
          type: integer
        receiver_strategy:
          default: honest
          title: Receiver Strategy
          type: string
        seed:
          default: 0
          title: Seed
          type: integer
        sender_strategy:
          default: honest
          title: Sender Strategy
          type: string
      title: AgentSimRequest
      type: object
    AgentSimResponse:
      properties:
        avg_rounds:
          title: Avg Rounds
          type: number
        dispute_rate:
          title: Dispute Rate
          type: number
        outcome_counts:
          additionalProperties:
            type: integer
          title: Outcome Counts
          type: object
        outcomes:
          items:
            $ref: '#/components/schemas/EscrowOutcomeResponse'
          title: Outcomes
          type: array
        report_hash:
          title: Report Hash
          type: string
        summary:
          title: Summary
          type: string
      required:
      - outcome_counts
      - dispute_rate
      - avg_rounds
      - report_hash
      - summary
      - outcomes
      title: AgentSimResponse
      type: object
    AggregateRequest:
      properties:
        commitments:
          items:
            $ref: '#/components/schemas/CommitmentRef'
          maxItems: 1000
          minItems: 1
          title: Commitments
          type: array
      required:
      - commitments
      title: AggregateRequest
      type: object
    AggregateResponse:
      properties:
        aggregate:
          title: Aggregate
          type: string
        count:
          title: Count
          type: integer
      required:
      - aggregate
      - count
      title: AggregateResponse
      type: object
    ArbiterListResponse:
      properties:
        arbiters:
          items:
            $ref: '#/components/schemas/ReputationScore'
          title: Arbiters
          type: array
        count:
          title: Count
          type: integer
      required:
      - arbiters
      - count
      title: ArbiterListResponse
      type: object
    ArbiterRecord:
      properties:
        arbiter_id:
          title: Arbiter Id
          type: string
        availability:
          default: true
          title: Availability
          type: boolean
        completed_arbitrations:
          title: Completed Arbitrations
          type: integer
        reputation_score:
          title: Reputation Score
          type: number
      required:
      - arbiter_id
      - reputation_score
      - completed_arbitrations
      title: ArbiterRecord
      type: object
    ArbitrateRequest:
      properties:
        dispute_id:
          title: Dispute Id
          type: string
        election_seed_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Election Seed Hash
        escrow_amount:
          title: Escrow Amount
          type: integer
        receiver_account:
          anyOf:
          - type: string
          - type: 'null'
          title: Receiver Account
        receiver_evidence:
          items:
            $ref: '#/components/schemas/DisputeEvidence'
          title: Receiver Evidence
          type: array
        sender_account:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Account
        sender_evidence:
          items:
            $ref: '#/components/schemas/DisputeEvidence'
          title: Sender Evidence
          type: array
      required:
      - dispute_id
      - sender_evidence
      - receiver_evidence
      - escrow_amount
      title: ArbitrateRequest
      type: object
    ArbitrationRecommendation:
      properties:
        analysis_hash:
          title: Analysis Hash
          type: string
        confidence:
          maximum: 1.0
          minimum: 0.0
          title: Confidence
          type: number
        dispute_id:
          title: Dispute Id
          type: string
        escalated_to_panel:
          default: false
          title: Escalated To Panel
          type: boolean
        escalation_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Escalation Reason
        evidence_root:
          default: ''
          title: Evidence Root
          type: string
        panel_election:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Panel Election
        provider:
          default: heuristic
          title: Provider
          type: string
        reasoning:
          title: Reasoning
          type: string
        recommendation:
          pattern: ^(favor_sender|favor_receiver|split|escalate|abstain)$
          title: Recommendation
          type: string
        risk_factors:
          items:
            type: string
          title: Risk Factors
          type: array
        suggested_split_pct:
          maximum: 100.0
          minimum: 0.0
          title: Suggested Split Pct
          type: number
      required:
      - dispute_id
      - recommendation
      - confidence
      - reasoning
      - risk_factors
      - suggested_split_pct
      - analysis_hash
      title: ArbitrationRecommendation
      type: object
    AttenuateRequest:
      properties:
        caveats:
          items:
            type: string
          maxItems: 32
          minItems: 1
          title: Caveats
          type: array
        token:
          minLength: 1
          title: Token
          type: string
      required:
      - token
      - caveats
      title: AttenuateRequest
      type: object
    AttenuateResponse:
      properties:
        caveats:
          items:
            type: string
          title: Caveats
          type: array
        token:
          title: Token
          type: string
      required:
      - token
      - caveats
      title: AttenuateResponse
      type: object
    AttestHopRequest:
      properties:
        service_hash:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Service Hash
          type: string
      required:
      - service_hash
      title: AttestHopRequest
      type: object
    BatchEscrowItem:
      description: A single escrow spec within a batch-create request.
      properties:
        amount_motes:
          description: Deposit amount in motes (1 CSPR = 1_000_000_000 motes). Canonical wire name is `amount_motes`; legacy `amount` is accepted as an input alias and will be removed in API v2.
          exclusiveMinimum: 0.0
          title: Amount Motes
          type: integer
        receiver:
          description: Casper account hash of the receiver (raw 64-hex or account-hash- prefixed)
          pattern: ^(account-hash-)?[0-9a-fA-F]{64}$
          title: Receiver
          type: string
        service_hash:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          title: Service Hash
          type: string
        ttl:
          default: 300
          description: Time-to-live in seconds
          maximum: 86400.0
          minimum: 60.0
          title: Ttl
          type: integer
      required:
      - receiver
      - amount_motes
      - service_hash
      title: BatchEscrowItem
      type: object
    BatchEscrowRequest:
      description: 'Request to create up to 50 escrows in a single on-chain deploy via

        escrow-manager.create_batch().'
      properties:
        escrows:
          items:
            $ref: '#/components/schemas/BatchEscrowItem'
          maxItems: 50
          minItems: 1
          title: Escrows
          type: array
      required:
      - escrows
      title: BatchEscrowRequest
      type: object
    BatchEscrowResponse:
      description: Result of a batch escrow creation.
      properties:
        created:
          title: Created
          type: integer
        deploy_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Deploy Hash
        records:
          items:
            $ref: '#/components/schemas/EscrowRecord'
          title: Records
          type: array
      required:
      - created
      - records
      title: BatchEscrowResponse
      type: object
    BatchLifecycleRequest:
      description: Request to batch-release or batch-cancel escrows.
      properties:
        arbiter_pubkeys:
          default: []
          items:
            type: string
          title: Arbiter Pubkeys
          type: array
        arbiter_signatures:
          default: []
          items:
            type: string
          title: Arbiter Signatures
          type: array
        service_hashes:
          items:
            type: string
          title: Service Hashes
          type: array
      required:
      - service_hashes
      title: BatchLifecycleRequest
      type: object
    BatchLifecycleResponse:
      properties:
        deploy_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Deploy Hash
        processed:
          title: Processed
          type: integer
      required:
      - deploy_hash
      - processed
      title: BatchLifecycleResponse
      type: object
    BatchPreviewRequest:
      properties:
        action:
          default: release
          description: Either "release" or "cancel".
          title: Action
          type: string
        arbiter_pubkeys:
          items:
            type: string
          title: Arbiter Pubkeys
          type: array
        arbiter_signatures:
          items:
            type: string
          title: Arbiter Signatures
          type: array
        service_hashes:
          items:
            type: string
          title: Service Hashes
          type: array
      required:
      - service_hashes
      title: BatchPreviewRequest
      type: object
    BatchPreviewResponse:
      properties:
        above_cap_hashes:
          items:
            type: string
          title: Above Cap Hashes
          type: array
        action:
          title: Action
          type: string
        admit:
          title: Admit
          type: boolean
        max_batch_size:
          title: Max Batch Size
          type: integer
        needs_quorum:
          title: Needs Quorum
          type: boolean
        rejections:
          items:
            $ref: '#/components/schemas/BatchRejectionResponse'
          title: Rejections
          type: array
        required_quorum:
          title: Required Quorum
          type: integer
        valid_arbiter_votes:
          title: Valid Arbiter Votes
          type: integer
      required:
      - admit
      - action
      - needs_quorum
      - valid_arbiter_votes
      - required_quorum
      - above_cap_hashes
      - rejections
      - max_batch_size
      title: BatchPreviewResponse
      type: object
    BatchRejectionResponse:
      properties:
        code:
          title: Code
          type: string
        detail:
          additionalProperties: true
          title: Detail
          type: object
        message:
          title: Message
          type: string
        service_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Service Hash
      required:
      - code
      - message
      title: BatchRejectionResponse
      type: object
    CUSUMResult:
      description: Result of a CUSUM update. Immutable snapshot.
      properties:
        alarm_lower:
          title: Alarm Lower
          type: boolean
        alarm_upper:
          title: Alarm Upper
          type: boolean
        direction:
          anyOf:
          - type: string
          - type: 'null'
          title: Direction
        n:
          minimum: 0.0
          title: N
          type: integer
        s_neg:
          title: S Neg
          type: number
        s_pos:
          title: S Pos
          type: number
      required:
      - n
      - s_pos
      - s_neg
      - alarm_upper
      - alarm_lower
      - direction
      title: CUSUMResult
      type: object
    ChainEscrowRequest:
      properties:
        hop_index:
          minimum: 0.0
          title: Hop Index
          type: integer
        service_hash:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Service Hash
          type: string
      required:
      - service_hash
      - hop_index
      title: ChainEscrowRequest
      type: object
    ChainId:
      description: 'Supported blockchain targets for cross-chain operations.


        Mirrors `contracts/stubs/src/chain_adapter.rs::ChainId` on the server side.'
      enum:
      - casper-testnet
      - casper-mainnet
      - ethereum
      - ethereum-sepolia
      - polygon
      - arbitrum
      title: ChainId
      type: string
    ClaimResponse:
      properties:
        amount_released:
          title: Amount Released
          type: integer
        ok:
          title: Ok
          type: boolean
        reason:
          title: Reason
          type: string
        remaining_pool:
          title: Remaining Pool
          type: integer
      required:
      - ok
      - amount_released
      - reason
      - remaining_pool
      title: ClaimResponse
      type: object
    CommitResponse:
      properties:
        root:
          title: Root
          type: string
        round_id:
          title: Round Id
          type: string
        total_committed:
          title: Total Committed
          type: integer
        winners_count:
          title: Winners Count
          type: integer
      required:
      - root
      - total_committed
      - winners_count
      - round_id
      title: CommitResponse
      type: object
    CommitmentRef:
      properties:
        commitment:
          title: Commitment
          type: string
      required:
      - commitment
      title: CommitmentRef
      type: object
    ComplianceDecisionResponse:
      properties:
        amount_motes:
          title: Amount Motes
          type: integer
        country_code:
          title: Country Code
          type: string
        permitted:
          title: Permitted
          type: boolean
        policy_notes:
          title: Policy Notes
          type: string
        regime:
          $ref: '#/components/schemas/JurisdictionRegime'
        rejections:
          items:
            type: string
          title: Rejections
          type: array
        report_reasons:
          items:
            type: string
          title: Report Reasons
          type: array
        requires_reporting:
          title: Requires Reporting
          type: boolean
        verification_level:
          $ref: '#/components/schemas/VerificationLevel'
      required:
      - permitted
      - country_code
      - regime
      - verification_level
      - amount_motes
      - requires_reporting
      - report_reasons
      - rejections
      - policy_notes
      title: ComplianceDecisionResponse
      type: object
    ConfigureFeeRequest:
      properties:
        new_fee_bps:
          description: Basis points, contract max 1000 = 10%
          maximum: 1000.0
          minimum: 0.0
          title: New Fee Bps
          type: integer
      required:
      - new_fee_bps
      title: ConfigureFeeRequest
      type: object
    CreateCrossChainRequest:
      properties:
        amount_motes:
          exclusiveMaximum: 1.8446744073709552e+19
          exclusiveMinimum: 0.0
          title: Amount Motes
          type: integer
        min_confirmations:
          default: 12
          maximum: 100.0
          minimum: 1.0
          title: Min Confirmations
          type: integer
        receiver:
          maxLength: 140
          minLength: 1
          title: Receiver
          type: string
        sender:
          maxLength: 140
          minLength: 1
          title: Sender
          type: string
        service_hash:
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-fA-F]{64}$
          title: Service Hash
          type: string
        trigger_chain:
          $ref: '#/components/schemas/ChainId'
        trigger_topic:
          default: ''
          maxLength: 68
          title: Trigger Topic
          type: string
        trigger_tx_hash:
          maxLength: 68
          minLength: 2
          title: Trigger Tx Hash
          type: string
      required:
      - sender
      - receiver
      - amount_motes
      - service_hash
      - trigger_chain
      - trigger_tx_hash
      title: CreateCrossChainRequest
      type: object
    DeclareIntentRequest:
      properties:
        agent_path:
          description: Ordered agent identifiers, e.g. ['A', 'B', 'C'] for a 2-hop A->B->C choreography. len(agent_path) - 1 hops planned.
          items:
            type: string
          maxItems: 17
          minItems: 2
          title: Agent Path
          type: array
        intent_id:
          anyOf:
          - maxLength: 128
            type: string
          - type: 'null'
          description: Caller-supplied intent id. Omit to have the server generate one (uuid4 hex).
          title: Intent Id
      required:
      - agent_path
      title: DeclareIntentRequest
      type: object
    DelegateCapabilityRequest:
      description: Request to delegate a capability from one agent to another.
      properties:
        capability_uri:
          description: URI identifying the capability (e.g., 'urn:escrow:release')
          maxLength: 256
          minLength: 1
          pattern: ^[a-zA-Z0-9_:/?.#=-]+$
          title: Capability Uri
          type: string
        delegatee_id:
          description: Public ID of the agent receiving the capability
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_:.-]+$
          title: Delegatee Id
          type: string
        delegator_id:
          description: Public ID of the delegating agent
          maxLength: 128
          minLength: 1
          pattern: ^[a-zA-Z0-9_:.-]+$
          title: Delegator Id
          type: string
        expiry_timestamp:
          description: Unix timestamp when the delegation expires
          exclusiveMinimum: 1700000000.0
          title: Expiry Timestamp
          type: integer
        signature:
          description: Ed25519 signature of the canonical delegation message
          maxLength: 128
          minLength: 128
          pattern: ^[0-9a-fA-F]{128}$
          title: Signature
          type: string
      required:
      - delegator_id
      - delegatee_id
      - capability_uri
      - expiry_timestamp
      - signature
      title: DelegateCapabilityRequest
      type: object
    DischargeRequest:
      properties:
        caveats:
          items:
            type: string
          maxItems: 16
          title: Caveats
          type: array
        discharge_identifier:
          maxLength: 128
          minLength: 1
          title: Discharge Identifier
          type: string
        location:
          default: ae402
          maxLength: 64
          minLength: 1
          title: Location
          type: string
        ttl_seconds:
          default: 3600
          maximum: 2592000.0
          minimum: 1.0
          title: Ttl Seconds
          type: integer
      required:
      - discharge_identifier
      title: DischargeRequest
      type: object
    DischargeResponse:
      properties:
        identifier:
          title: Identifier
          type: string
        token:
          title: Token
          type: string
      required:
      - token
      - identifier
      title: DischargeResponse
      type: object
    DisputeEvidence:
      properties:
        claimant:
          title: Claimant
          type: string
        content_hash:
          title: Content Hash
          type: string
        description:
          title: Description
          type: string
        escrow_id:
          title: Escrow Id
          type: string
        evidence_type:
          pattern: ^(text|screenshot|hash|transaction)$
          title: Evidence Type
          type: string
        timestamp:
          title: Timestamp
          type: integer
      required:
      - escrow_id
      - claimant
      - evidence_type
      - content_hash
      - description
      - timestamp
      title: DisputeEvidence
      type: object
    DisputeRequest:
      properties:
        reason_hash:
          maxLength: 64
          minLength: 64
          title: Reason Hash
          type: string
        service_hash:
          maxLength: 64
          minLength: 64
          title: Service Hash
          type: string
        wallet_tx_hash:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          title: Wallet Tx Hash
      required:
      - service_hash
      - reason_hash
      title: DisputeRequest
      type: object
    ElectArbiterRequest:
      properties:
        dispute_id:
          description: Unique dispute identifier
          title: Dispute Id
          type: string
        receiver:
          description: Dispute receiver account (excluded from election); same format as `sender`.
          title: Receiver
          type: string
        seed_hash:
          description: A recent block hash or other verifiable random seed for election
          title: Seed Hash
          type: string
        sender:
          description: Dispute sender account (excluded from election). For the on-chain VRF path this must match the on-chain arbiter identity format -- a plain lowercase-hex Casper account hash, no 'account-hash-' prefix -- since that is what elected candidates are compared against (INVARIANT 5).
          title: Sender
          type: string
      required:
      - dispute_id
      - sender
      - receiver
      - seed_hash
      title: ElectArbiterRequest
      type: object
    ElectArbiterResponse:
      properties:
        dispute_id:
          title: Dispute Id
          type: string
        elected_arbiter:
          $ref: '#/components/schemas/ArbiterRecord'
        elected_at:
          title: Elected At
          type: integer
        election_proof:
          title: Election Proof
          type: string
        method:
          default: onchain_vrf
          title: Method
          type: string
      required:
      - dispute_id
      - elected_arbiter
      - election_proof
      - elected_at
      title: ElectArbiterResponse
      type: object
    EscrowListResponse:
      properties:
        count:
          title: Count
          type: integer
        escrows:
          items:
            additionalProperties: true
            type: object
          title: Escrows
          type: array
      required:
      - escrows
      - count
      title: EscrowListResponse
      type: object
    EscrowOutcomeResponse:
      properties:
        arbitration_confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Arbitration Confidence
        arbitration_recommendation:
          anyOf:
          - type: string
          - type: 'null'
          title: Arbitration Recommendation
        disputed:
          title: Disputed
          type: boolean
        escrow_id:
          title: Escrow Id
          type: string
        final_status:
          title: Final Status
          type: string
        rounds_taken:
          title: Rounds Taken
          type: integer
      required:
      - escrow_id
      - final_status
      - rounds_taken
      - disputed
      - arbitration_recommendation
      - arbitration_confidence
      title: EscrowOutcomeResponse
      type: object
    EscrowRecord:
      description: 'On-chain escrow record.


        Optional ML-KEM fields are returned by create_escrow so the console can

        prove that post-quantum metadata encryption actually ran for the demo.'
      properties:
        amount:
          title: Amount
          type: integer
        commitment:
          anyOf:
          - type: string
          - type: 'null'
          title: Commitment
        confidential:
          default: false
          title: Confidential
          type: boolean
        created_at:
          title: Created At
          type: integer
        deploy_hash:
          anyOf:
          - type: string
          - type: 'null'
          title: Deploy Hash
        escrow_type:
          default: standard
          title: Escrow Type
          type: string
        funded_block:
          default: 0
          title: Funded Block
          type: integer
