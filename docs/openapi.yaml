openapi: 3.1.0
info:
  title: AgentEscrow402
  description: x402-compatible payment middleware for AI agents on Casper
  version: 0.2.0
paths:
  /escrow/cep18-permit-nonce:
    get:
      tags:
      - multi-asset
      - streaming
      summary: Get Cep18 Permit Nonce
      description: 'Public read of the next expected permit nonce for `owner_account_hash`

        on the given CEP-18 contract -- needed by the frontend to build the

        exact canonical message the wallet will sign (see PermitProof /

        frontend/src/lib/cep18Permit.ts). No auth needed: this is public

        on-chain state, not a state-changing call.'
      operationId: get_cep18_permit_nonce_escrow_cep18_permit_nonce_get
      parameters:
      - name: contract_hash
        in: query
        required: true
        schema:
          type: string
          title: Contract Hash
      - name: owner_account_hash
        in: query
        required: true
        schema:
          type: string
          title: Owner Account Hash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Cep18 Permit Nonce Escrow Cep18 Permit Nonce Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/multi-asset:
    post:
      tags:
      - multi-asset
      - streaming
      summary: Create Multi Asset Escrow
      description: 'Creates a new multi-asset escrow.

        The sender (from X402 header) transfers the specified token amount to the
        escrow contract.'
      operationId: create_multi_asset_escrow_escrow_multi_asset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultiAssetEscrowRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/stream:
    post:
      tags:
      - multi-asset
      - streaming
      summary: Create Streaming Escrow
      description: 'Creates a new streaming escrow.

        The sender (from X402 header) deposits the total amount into a streaming contract,

        which then releases funds to the receiver over a specified time period.'
      operationId: create_streaming_escrow_escrow_stream_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamEscrowRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EscrowRecord'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/{service_hash}/stream-status:
    get:
      tags:
      - multi-asset
      - streaming
      summary: Get Stream Status
      description: Retrieves the current status of a streaming escrow, including streamed
        and remaining amounts.
      operationId: get_stream_status_escrow__service_hash__stream_status_get
      parameters:
      - name: service_hash
        in: path
        required: true
        schema:
          type: string
          title: Service Hash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/{service_hash}/stream-claim:
    post:
      tags:
      - multi-asset
      - streaming
      summary: Claim Streamed Escrow
      description: 'Claim a fully vested streaming escrow — triggers a real on-chain
        release.


        A streaming escrow''s vesting schedule is computed API-side (linear from

        start_time to end_time).  Once 100% of the stream duration has elapsed,

        this endpoint settles the escrow on-chain by calling the same release()

        path as a standard escrow.  Before the stream is fully vested, the

        request is rejected with 422.


        This turns streaming from pure API simulation into "API-timed vesting

        with on-chain settlement at maturity".'
      operationId: claim_streamed_escrow_escrow__service_hash__stream_claim_post
      parameters:
      - name: service_hash
        in: path
        required: true
        schema:
          type: string
          title: Service Hash
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Claim Streamed Escrow Escrow  Service Hash  Stream
                  Claim Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/atomic-swap/commit:
    post:
      tags:
      - multi-asset
      - streaming
      summary: Commit Atomic Swap
      description: 'Commits a SHA256 hash of a secret preimage for an atomic swap.

        This is the first step in a commit-reveal scheme.


        Live mode calls the deployed escrow contract''s real `commit_swap` entry

        point (contracts/escrow/src/main.rs), which enforces on-chain that the

        caller is the escrow''s sender and that no commit already exists for this

        service_hash -- see CasperClient.commit_swap. Sandbox mode (or no casper

        client configured) keeps the previous purely in-memory simulation.'
      operationId: commit_atomic_swap_escrow_atomic_swap_commit_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommitRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Commit Atomic Swap Escrow Atomic Swap Commit Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/atomic-swap/reveal:
    post:
      tags:
      - multi-asset
      - streaming
      summary: Reveal Atomic Swap
      description: 'Reveals the secret preimage for an atomic swap.

        The contract verifies the preimage against the previously committed hash.

        If valid, the escrow is released.


        Live mode calls the deployed escrow contract''s real `reveal_swap` entry

        point, which verifies sha256(preimage) == commit_hash *on-chain* and

        releases escrowed funds directly to the receiver as part of the same

        transaction (the HTLC model: the contract has no caller-identity check

        here, knowing the preimage IS the authorization) -- see

        CasperClient.reveal_swap. We still verify the hash locally first so we

        can return a clean 400 instead of paying gas for a doomed on-chain call.'
      operationId: reveal_atomic_swap_escrow_atomic_swap_reveal_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevealRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Reveal Atomic Swap Escrow Atomic Swap Reveal Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /escrow/multi-asset/{service_hash}/release:
    post:
      tags:
      - multi-asset
