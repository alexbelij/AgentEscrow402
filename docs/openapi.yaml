          title: Transcript
          type: string
      required:
      - commitment
      - range_proof
      title: VerifyRequest
      type: object
    server__zk_amount_api__VerifyResponse:
      properties:
        bits:
          title: Bits
          type: integer
        valid:
          title: Valid
          type: boolean
        verify_ms:
          title: Verify Ms
          type: number
      required:
      - valid
      - verify_ms
      - bits
      title: VerifyResponse
      type: object
info:
  description: x402-compatible payment middleware for AI agents on Casper
  title: AgentEscrow402
  version: 0.2.0
openapi: 3.1.0
paths:
  /admin/configure-fee:
    post:
      description: Update the insurance fee (basis points, contract max 1000 = 10%).
      operationId: configure_fee_admin_configure_fee_post
      parameters:
      - in: header
        name: x-admin-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureFeeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Configure Fee Admin Configure Fee Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Configure Fee
      tags:
      - admin
  /admin/emergency-freeze:
    post:
      description: 'Freeze escrow-contract state changes (release/refund/dispute/resolve/

        commit_swap/reveal_swap). Reversible -- see `POST /admin/unfreeze`.

        Use as a last resort (e.g. a discovered exploit) while investigating.'
      operationId: emergency_freeze_admin_emergency_freeze_post
      parameters:
      - in: header
        name: x-admin-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Emergency Freeze Admin Emergency Freeze Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Emergency Freeze
      tags:
      - admin
  /admin/set-arbiters:
    post:
      description: 'Replace the whole on-chain arbiter_list used by resolve() and the A1

        cap-approval quorum. Remember to also update ARBITER_PUBKEYS env var to

        match, or the backend''s local fast-fail checks will use a stale list.'
      operationId: set_arbiters_admin_set_arbiters_post
      parameters:
      - in: header
        name: x-admin-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetArbitersRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Set Arbiters Admin Set Arbiters Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Arbiters
      tags:
      - admin
  /admin/set-release-cap:
    post:
      description: 'Update the A1 release cap (motes). Remember to also update the

        RELEASE_CAP_MOTES env var (server/config.py''s local fast-fail mirror) to

        match, or /release and /escrow/atomic-swap/reveal will fast-fail against

        a stale cap even though the on-chain value already changed.'
      operationId: set_release_cap_admin_set_release_cap_post
      parameters:
      - in: header
        name: x-admin-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetReleaseCapRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Set Release Cap Admin Set Release Cap Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Set Release Cap
      tags:
      - admin
  /admin/unfreeze:
    post:
      description: 'Resume operations after `emergency_freeze` (installer-only on-chain

        check, plus the same X-Admin-Key gate as every other route in this

        file).'
      operationId: unfreeze_admin_unfreeze_post
      parameters:
      - in: header
        name: x-admin-key
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Admin-Key
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Unfreeze Admin Unfreeze Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Unfreeze
      tags:
      - admin
  /agents:
    get:
      description: List known agents with their reputation scores.
      operationId: list_agents_agents_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: List Agents
  /api/v1/events/stream:
    get:
      description: 'Server-Sent Events stream for real-time escrow updates.


        Exposed on two paths:

        - ``/events`` (canonical, historical)

        - ``/api/v1/events/stream`` (AE402 Agent Spec alias)'
      operationId: event_stream_api_v1_events_stream_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      summary: Event Stream
  /arbitration/analyze:
    post:
      description: "Run LLM arbitration on dispute evidence.\n\nTries Groq → NVIDIA NIM → OpenRouter → heuristic fallback. Returns\nrecommendation: favor_sender | favor_receiver | split | escalate |\nabstain.\n\nAE-A1.4 auto-escalation (flat fields on the response):\n  * verdict.recommendation == 'abstain'  → always route to VRF panel\n  * verdict.recommendation == 'escalate' AND confidence <\n    _ESCALATION_CONFIDENCE_MAX → route to VRF panel\n  * escalation needs sender_account + receiver_account in the\n    request (they must be excluded from the panel); when missing,\n    the verdict is returned with escalated_to_panel=false and\n    escalation_reason set so the caller knows what to add."
      operationId: arbitrate_dispute_arbitration_analyze_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArbitrateRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArbitrationRecommendation'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Arbitrate Dispute
      tags:
      - arbitration
  /arbitration/history:
    get:
      description: 'Most recent LLM arbitration analyses (process-lifetime in-memory history),

        newest first. Powers the console''s Arbitration verdict-history view.'
      operationId: arbitration_history_arbitration_history_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          title: Limit
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ArbitrationRecommendation'
                title: Response Arbitration History Arbitration History Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Arbitration History
      tags:
      - arbitration
  /arbitration/verify-evidence:
    post:
      description: 'Verify an evidence Merkle inclusion proof against a published root.


        This is the "UI verify button" surface (AE-A2). A judge or auditor

        can independently reproduce the check with any language that has

        sha256 — the endpoint is a convenience, not a source of trust.'
      operationId: arbitration_verify_evidence_arbitration_verify_evidence_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEvidenceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEvidenceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Arbitration Verify Evidence
      tags:
      - arbitration
  /bridge/htlc/initiate:
    post:
      operationId: initiate_swap_bridge_htlc_initiate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateSwapRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwapResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Initiate Swap
      tags:
      - bridge-htlc
  /bridge/htlc/legs/{leg_id}:
    get:
      operationId: get_leg_bridge_htlc_legs__leg_id__get
      parameters:
      - in: path
        name: leg_id
        required: true
        schema:
          title: Leg Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Leg
      tags:
      - bridge-htlc
  /bridge/htlc/legs/{leg_id}/claim:
    post:
      operationId: claim_leg_bridge_htlc_legs__leg_id__claim_post
      parameters:
      - in: path
        name: leg_id
        required: true
        schema:
          title: Leg Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/server__bridge_htlc_api__ClaimRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Claim Leg
      tags:
      - bridge-htlc
  /bridge/htlc/legs/{leg_id}/lock:
    post:
      operationId: lock_leg_bridge_htlc_legs__leg_id__lock_post
      parameters:
      - in: path
        name: leg_id
        required: true
        schema:
          title: Leg Id
          type: string
      requestBody:
        content:
