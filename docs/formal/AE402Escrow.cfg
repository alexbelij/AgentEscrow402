\* C16: TLC model-check configuration for AE402Escrow.tla.
\*
\* Finite instantiation chosen to keep model-check runtime under a minute
\* on CI while still exercising every valid FSM edge at least once.

SPECIFICATION Spec

\* Deadlock detection would fire the moment every escrow reaches a
\* terminal status (no more enabled actions). That's the whole point of
\* the model — terminal is desired. Disable the built-in check.
CHECK_DEADLOCK FALSE

CONSTANTS
    Escrows = {e1, e2, e3}
    MaxAmount = 5

INVARIANTS
    TypeInvariant
    Inv_ValidStatusTransition
    Inv_NoDoubleRelease
    Inv_NoRefundAfterRelease
    Inv_TombstonedNoReplay
    Inv_All

PROPERTIES
    Live_PendingProgresses
