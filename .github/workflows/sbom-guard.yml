name: SBOM Regeneration Guard

# Regenerates every CycloneDX SBOM under sbom/ from scratch on push/PR to main
# and fails if any of them drift from the checked-in copy. Prevents dependency
# updates from silently leaving stale SBOMs behind.
#
# Rationale: R14a review found that server-casper-tx-sbom.json was silently
# empty because npm install had not been run before generation. This guard
# ensures every SBOM stays in sync with its actual dependency manifest.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sbom-regen-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version '^0.5'

      - name: Install cyclonedx-py + cyclonedx-npm
        run: |
          pip install --upgrade pip
          pip install 'cyclonedx-bom>=4,<5'
          # Pinned exact (not ^2): a routine 2.x patch release changed how
          # purls are rendered (dropped the `?vcs_url=` qualifier), which
          # made every run of this guard fail on pure formatting drift with
          # zero actual dependency changes -- see key_set() below for the
          # matching purl-normalization fix, which is the real fix; this
          # pin just keeps the two npm SBOM steps reproducible run-to-run.
          npm install --global '@cyclonedx/cyclonedx-npm@2.1.0'

      - name: Regenerate Python SBOM (requirements.txt)
        # cyclonedx-py 5.x renamed --output-file/--output-format to -o/--of;
        # we pin the flag names we actually use so both 4.x and 5.x install
        # cleanly (see sbom-guard install step: `cyclonedx-bom>=4,<5`).
        run: |
          cyclonedx-py requirements requirements.txt \
            -o /tmp/regen-python-sbom.json \
            --of JSON

      - name: Install frontend deps + regenerate frontend SBOM
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file /tmp/regen-frontend-sbom.json \
            --output-format json

      - name: Install casper_tx deps + regenerate casper_tx SBOM
        working-directory: server/casper_tx
        run: |
          npm install --no-audit --no-fund
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-file /tmp/regen-casper-tx-sbom.json \
            --output-format json

      - name: Regenerate Rust contract SBOMs
        working-directory: contracts
        run: |
          cargo cyclonedx --format json --spec-version 1.3 --all
          mkdir -p /tmp/rust-sboms
          find . -name '*.cdx.json' -not -path './target/*' \
            -exec cp -v {} /tmp/rust-sboms/ \;

      - name: Compare each SBOM against checked-in copy (component set only)
        run: |
          set -e
          # Compare only the set of components (name+version+purl), not
          # generation timestamps or serial numbers which change every run.
          #
          # purl is normalized to drop any query string (e.g. `?vcs_url=...`)
          # before comparing: cyclonedx-npm 2.x has changed exactly what it
          # appends there across minor releases with zero actual dependency
          # change, which made this guard fail on pure tool-formatting drift.
          # name+version+bare-purl is what actually identifies "did the
          # dependency set change", which is this guard's real job.
          compare_sbom() {
            local checked_in="$1"
            local regenerated="$2"
            local label="$3"
            python3 - <<PY
          import json, sys
          def key_set(path):
              d = json.load(open(path))
              def norm_purl(c):
                  p = c.get('purl')
                  if not p:
                      return p
                  # Strip both the query string (?vcs_url=...) and any
                  # subpath fragment (#packages/foo) -- both have been seen
                  # to vary purely by cyclonedx-npm version, with the exact
                  # same underlying dependency.
                  return p.split('?', 1)[0].split('#', 1)[0]
              return {(c.get('name'), c.get('version'), norm_purl(c))
                      for c in d.get('components', [])}
          checked = key_set("$checked_in")
          regen   = key_set("$regenerated")
          only_checked = checked - regen
          only_regen   = regen - checked
          if only_checked or only_regen:
              print("SBOM DRIFT: $label")
              if only_checked:
                  print(f"  Only in checked-in ({len(only_checked)}):")
                  for k in sorted(only_checked)[:20]:
                      print(f"    {k}")
              if only_regen:
                  print(f"  Only in regenerated ({len(only_regen)}):")
                  for k in sorted(only_regen)[:20]:
                      print(f"    {k}")
              sys.exit(1)
          print(f"OK: $label ({len(checked)} components match)")
          PY
          }

          compare_sbom sbom/python-sbom.json /tmp/regen-python-sbom.json python
          compare_sbom sbom/frontend-sbom.json /tmp/regen-frontend-sbom.json frontend
          compare_sbom sbom/server-casper-tx-sbom.json /tmp/regen-casper-tx-sbom.json casper_tx
          for f in /tmp/rust-sboms/*.cdx.json; do
            base=$(basename "$f")
            if [ -f "sbom/rust-contracts/$base" ]; then
              compare_sbom "sbom/rust-contracts/$base" "$f" "rust:$base"
            else
              echo "WARN: regenerated $base but no checked-in copy — new crate?"
            fi
          done
