name: OpenAPI Drift Gate

# Fails PRs that change API routes / request-response models without
# regenerating docs/openapi.yaml. This is our contract with SDK
# consumers: the yaml file in git is the schema they generate types
# against, so it MUST stay in sync with the running FastAPI app.
#
# Local fix: `python scripts/gen_openapi.py` then commit the diff.

on:
  pull_request:
    paths:
      - 'server/**'
      - 'docs/openapi.yaml'
      - 'scripts/gen_openapi.py'
      - 'pyproject.toml'
      - '.github/workflows/openapi-drift.yml'

permissions:
  contents: read

jobs:
  drift-check:
    name: docs/openapi.yaml matches live app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install app deps
        run: |
          python -m pip install --upgrade pip
          # Install the project so `import server.app` resolves at runtime.
          pip install -e '.[dev]' || pip install -e .
          # PyYAML is needed by the regen script itself.
          pip install pyyaml

      - name: Regenerate + diff
        run: python scripts/gen_openapi.py --check
