name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov ruff black
      - name: Ruff (lint gate)
        # Baseline must stay green. If you land a PR that adds a lint
        # error, this job fails; fix in the PR, do not gate-bypass here.
        # Config lives in pyproject.toml (line-length 120, select E/F/I/W,
        # per-file-ignores only for tests/test_business_logic.py::E402).
        run: python -m ruff check .
      - name: Black (format gate)
        run: python -m black --check --line-length 120 .
      - name: Compile check
        run: python -m py_compile server/app.py
      - name: Contract-audit tool syntax + onchain.json schema
        # AE-4 Gate 1 lightweight gate. Ensures the audit tool always parses
        # and `deploy-out/onchain.json` stays a valid contract registry
        # (each entry has contract_hash + deploy_hash). The heavyweight
        # rebuild+RPC comparison lives in contract-audit-nightly.yml so PR
        # CI stays offline and fast.
        run: |
          python -m py_compile scripts/audit_contract_artifact.py
          python scripts/audit_contract_artifact.py --help > /dev/null
          python -c "import json, sys; d=json.load(open('deploy-out/onchain.json'))['contracts']; missing=[k for k,v in d.items() if not (v.get('contract_hash','').startswith('hash-') and len(v.get('deploy_hash',''))==64)]; sys.exit(f'invalid entries: {missing}' if missing else 0)"
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Coverage
        run: pytest tests/ --cov=server --cov-report=term-missing --cov-fail-under=70

  docker-compose-smoke:
    # Defence-checklist gate: prove `docker compose up` on a genuinely fresh
    # checkout actually boots and serves /health. This is the exact path a
    # judge follows from the README's "Or with Docker" quickstart -- it was
    # never verified end-to-end before 2026-07-25 (docker-compose.yml existed
    # but was undocumented and untested; `env_file: .env` silently assumed a
    # .env that a fresh clone does not have). Keep this job fast/offline;
    # it must not depend on CASPER_NODE_URL or any live network.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: cp .env.example .env (exactly what the README quickstart says)
        run: cp .env.example .env
      - name: docker compose up --build (detached)
        run: docker compose up --build -d
      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health; then echo; echo "healthy after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "never became healthy" >&2
          docker compose logs
          exit 1
      - name: Smoke assertions on /health payload
        run: |
          curl -sf http://localhost:8000/health | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok', d; assert d['sandbox'] is True, d; print('OK:', d)"
      - name: docker compose logs (always, for debugging)
        if: always()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build

  contracts:
    # Host-target logic tests for the Casper/Odra contracts: the
    # workspace's #[cfg(test)] modules (tests/ crate + multi-asset-escrow's
    # lib.rs/logic.rs split) exercise state-machine invariants (fee/TTL/HTLC/
    # quorum/reputation math, insurance anti-replay, escrow status
    # transitions) on the host target, since the contracts themselves are
    # `#![no_std] #![no_main]` wasm32-only binaries that can't run a normal
    # test harness. This job was missing entirely before 2026-07-24 despite
    # docs/README claiming "cargo test" runs in CI -- add carefully, don't
    # remove without updating those docs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned nightly toolchain
        # Must match contracts/rust-toolchain.toml. See that file's comment
        # for why this exact nightly is pinned (wasm preprocessing
        # compatibility) -- unrelated to these host-target tests, but keep
        # a single source of truth for the toolchain version.
        run: |
          rustup toolchain install nightly-2025-01-01 --profile minimal
          rustup default nightly-2025-01-01
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - name: Mirrored-logic tests (tests/ crate)
        run: cd contracts && cargo test -p tests
      - name: multi-asset-escrow host-target logic tests
        run: cd contracts && cargo test -p multi-asset-escrow --lib
      - name: insurance-pool host-target claim-preconditions tests
        run: cd contracts && cargo test -p insurance-pool --lib
