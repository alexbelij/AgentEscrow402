name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install pytest-cov ruff black
      - name: Ruff (lint gate)
        # Baseline must stay green. If you land a PR that adds a lint
        # error, this job fails; fix in the PR, do not gate-bypass here.
        # Config lives in pyproject.toml (line-length 120, select E/F/I/W,
        # per-file-ignores only for tests/test_business_logic.py::E402).
        run: python -m ruff check .
      - name: Black (format gate)
        run: python -m black --check --line-length 120 .
      - name: Compile check
        run: python -m py_compile server/app.py
      - name: Run tests
        run: pytest tests/ -v --tb=short
      - name: Coverage
        run: pytest tests/ --cov=server --cov-report=term-missing --cov-fail-under=70

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: cd frontend && npm ci
      - run: cd frontend && npx tsc --noEmit
      - run: cd frontend && npm run build
