name: frontend-build-check

# Compiles the console frontend on every PR that touches frontend/.
# Fails fast on TS errors or missing components (the classic "PR added
# a component but forgot to wire it into the sidebar" regression).

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-build-check.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
