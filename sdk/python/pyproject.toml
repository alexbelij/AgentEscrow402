[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentescrow402-sdk"
version = "0.1.0"
description = "Python SDK for AgentEscrow402 — trustless AI agent escrow payments on Casper Network"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AgentEscrow402", email = "hello@ae402.xyz" },
]
keywords = ["casper", "escrow", "x402", "ai-agents", "web3", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.24",
    "cryptography>=41",
    "pydantic>=2.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1"]
mcp = ["mcp>=0.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.28",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
ae402 = "agentescrow402_sdk.cli:main"

[project.urls]
Homepage = "https://ae402.xyz"
Repository = "https://github.com/alexbelij/AgentEscrow402"
Documentation = "https://github.com/alexbelij/AgentEscrow402/blob/main/sdk/python/README.md"
Issues = "https://github.com/alexbelij/AgentEscrow402/issues"

[tool.hatch.build.targets.wheel]
packages = ["agentescrow402_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "agentescrow402_sdk",
    "tests",
    "README.md",
    "pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
