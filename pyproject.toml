[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# test_business_logic.py is a deliberately section-organized "mega" test
# file: imports live next to the block of tests that exercises them, not
# hoisted to the top, so a reader reviewing e.g. the "Risk Scoring" section
# sees its imports right above the tests. E402 doesn't apply here.
"tests/test_business_logic.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["server", "sdk"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
# tests/test_e2e_live.py is a standalone smoke-test script (module-level
# code + sys.exit(1), no pytest test functions) meant to be run directly
# against the live Render backend (`python tests/test_e2e_live.py`), not
# collected by pytest. It matches the test_*.py glob by accident, and its
# sys.exit(1) on a live-network hiccup (backend cold start, transient
# timeout) crashes pytest's collection with an INTERNALERROR instead of a
# normal, isolated test failure — this caused two flaky red CI runs in one
# session even though nothing in the actual codebase was broken. Ignore it
# in automated CI; run it manually when you want a live-deployment check.
addopts = "--ignore=tests/test_e2e_live.py --ignore=tests/integration"
markers = [
    "casper_net: integration tests that require a running NCTL Casper network (see docker-compose.casper-nctl.yml)",
]
