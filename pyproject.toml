[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentescrow402"
version = "0.2.0"
description = "Python SDK, LangChain tool, MCP server, and CLI for AgentEscrow402 — trustless AI agent escrow payments on Casper Network"
readme = "sdk/README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "AgentEscrow402", email = "hello@ae402.xyz" },
]
keywords = ["casper", "escrow", "x402", "ai-agents", "web3", "ed25519"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "httpx>=0.24",
    "cryptography>=41",
    "pydantic>=2.0",
]

[project.optional-dependencies]
langchain = ["langchain>=0.1"]
mcp = ["mcp>=0.9"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-httpx>=0.28",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.scripts]
ae402 = "sdk.cli:main"

[project.urls]
Homepage = "https://ae402.xyz"
Repository = "https://github.com/alexbelij/AgentEscrow402"
Documentation = "https://github.com/alexbelij/AgentEscrow402/blob/main/sdk/README.md"
Issues = "https://github.com/alexbelij/AgentEscrow402/issues"

[tool.hatch.build.targets.wheel]
packages = ["sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "sdk",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]
exclude = [
    "sdk/__pycache__",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# test_business_logic.py is a deliberately section-organized "mega" test
# file: imports live next to the block of tests that exercises them, not
# hoisted to the top, so a reader reviewing e.g. the "Risk Scoring" section
# sees its imports right above the tests. E402 doesn't apply here.
"tests/test_business_logic.py" = ["E402"]
# server/app.py, casper_client.py, middleware.py accumulated deliberate
# mid-file imports across several feature-branch merges (each new feature
# section imports what it needs right above itself, `_`-prefixed aliases
# to avoid touching/reordering the top-of-file import block during fast
# batch merges). Accepted trade-off, not worth reshuffling at this point.
"server/app.py" = ["E402"]
"server/casper_client.py" = ["E402"]
"server/middleware.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["server", "sdk"]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.pytest.ini_options]
# tests/test_e2e_live.py is a standalone smoke-test script (module-level
# code + sys.exit(1), no pytest test functions) meant to be run directly
# against the live Render backend (`python tests/test_e2e_live.py`), not
# collected by pytest. It matches the test_*.py glob by accident, and its
# sys.exit(1) on a live-network hiccup (backend cold start, transient
# timeout) crashes pytest's collection with an INTERNALERROR instead of a
# normal, isolated test failure — this caused two flaky red CI runs in one
# session even though nothing in the actual codebase was broken. Ignore it
# in automated CI; run it manually when you want a live-deployment check.
#
# tests/integration/ requires a running local NCTL Casper network
# (docker-compose.casper-nctl.yml) and is not run in default CI; see
# .github/workflows/casper-nctl-integration.yml for its own job.
#
# tests/test_testnet_integration.py's `testnet` marker gates tests that hit
# the real Casper testnet RPC fallback chain -- excluded from the default
# run for the same reason (no network dependency for CI/local dev). Run
# them explicitly with `pytest -m testnet tests/test_testnet_integration.py`.
# `network` gates live-internet tests (e.g. bridge_evm_adapter’s Sepolia
# integration harness under tests/test_bridge_evm_sepolia_integration.py).
# CI has no funded EVM wallet / stable Sepolia RPC — opt into them locally
# with `pytest -m network`.
addopts = "--ignore=tests/test_e2e_live.py --ignore=tests/integration -m 'not testnet and not network'"
markers = [
    "casper_net: integration tests that require a running NCTL Casper network (see docker-compose.casper-nctl.yml)",
    "network: integration tests that require live network access (e.g. Sepolia RPC) — skipped offline",
    "testnet: opt-in tests hitting live Casper testnet RPC (skipped by default)",
]
